services:
  postgres:
    image: postgres:16
    container_name: nhacnho-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nhacnho
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: nhacnho-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  users_service:
    build:
      context: ./services/users
    container_name: nhacnho-users_service
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    restart: unless-stopped

  orders_service:
    build:
      context: ./services/orders
    container_name: nhacnho-orders_service
    env_file:
      - .env
    depends_on:
      - postgres
    restart: unless-stopped

  notification_service:
    build:
      context: ./services/notification
    container_name: nhacnho-notification_service
    env_file:
      - .env
    depends_on:
      - postgres
    restart: unless-stopped

  lab_service:
    build:
      context: ./services/lab
    container_name: nhacnho-lab_service
    env_file:
      - .env
    depends_on:
      - postgres
    restart: unless-stopped

  scheduler_service:
    build:
      context: ./services/scheduler
    container_name: nhacnho-scheduler_service
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./services/frontend
    container_name: nhacnho-frontend
    env_file:
      - .env
    ports:
      - "3000:80"
    depends_on:
      - users_service
      - orders_service
      - notification_service
      - lab_service
    restart: unless-stopped

volumes:
  postgres_data:
