name: 🧪 CI — Lint & Test Python Services

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [orders, notification, scheduler]
    env:
      PYTHONUNBUFFERED: 1

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set REQUIREMENTS_FILE path
        id: set_req_file
        run: |
          if [ "${{ matrix.service }}" = "scheduler" ]; then
            echo "REQUIREMENTS_FILE=scheduler/requirements.txt" >> $GITHUB_ENV
          else
            echo "REQUIREMENTS_FILE=services/${{ matrix.service }}/requirements.txt" >> $GITHUB_ENV
          fi

      - name: 🛑 Cancel workflow if requirements file not found
        run: |
          if [ ! -f "${{ env.REQUIREMENTS_FILE }}" ]; then
            echo "❌ File ${{ env.REQUIREMENTS_FILE }} not found! Cancelling workflow."
            exit 1
          fi

      - name: 💾 Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles(env.REQUIREMENTS_FILE) }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install requirements
        run: pip install --upgrade pip && pip install -r ${{ env.REQUIREMENTS_FILE }}

      # Chạy flake8 nếu có file cấu hình và cài trong requirements.txt
      - name: 💄 Lint code (flake8)
        run: |
          if command -v flake8 >/dev/null 2>&1; then
            flake8 .
          else
            echo "flake8 not installed, skipping lint."
          fi

      # Chạy mypy nếu có
      - name: 🧠 Type check (mypy)
        run: |
          if command -v mypy >/dev/null 2>&1; then
            mypy --ignore-missing-imports .
          else
            echo "mypy not installed, skipping type check."
          fi

      # Chạy pytest nếu có
      - name: 🧪 Run tests (pytest)
        run: |
          if command -v pytest >/dev/null 2>&1; then
            pytest --maxfail=1 --disable-warnings -q || true
          else
            echo "pytest not installed, skipping tests."
          fi
