name: 🧪 CI — Lint & Test Python Services

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [orders, notification, scheduler]
    env:
      PYTHONUNBUFFERED: 1

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set REQUIREMENTS_FILE path
        id: set_req_file
        run: |
          echo "REQUIREMENTS_FILE=services/${{ matrix.service }}/requirements.txt" >> $GITHUB_ENV

      - name: 🛑 Cancel workflow if requirements file not found
        run: |
          if [ ! -f "${{ env.REQUIREMENTS_FILE }}" ]; then
            echo "❌ File ${{ env.REQUIREMENTS_FILE }} not found! Cancelling workflow."
            exit 1
          fi

      - name: 💾 Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles(env.REQUIREMENTS_FILE) }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install requirements
        run: pip install --upgrade pip && pip install -r ${{ env.REQUIREMENTS_FILE }}

      # ---- AUTOPEP8 ----
      - name: ⚡️ Auto-format code with autopep8
        run: |
          pip install autopep8
          if [ "${{ matrix.service }}" = "orders" ] || [ "${{ matrix.service }}" = "notification" ]; then
            autopep8 --in-place --recursive services/${{ matrix.service }}/app
          elif [ "${{ matrix.service }}" = "scheduler" ]; then
            autopep8 --in-place --recursive services/scheduler/scheduler
          fi

      # ---- FLAKE8 ----
      - name: 💄 Lint code with flake8
        run: |
          if [ "${{ matrix.service }}" = "orders" ] || [ "${{ matrix.service }}" = "notification" ]; then
            flake8 services/${{ matrix.service }}/app
          elif [ "${{ matrix.service }}" = "scheduler" ]; then
            flake8 services/scheduler/scheduler
          fi

      # ---- MYPY ----
      - name: 🧠 Type check with mypy
        run: |
          if [ "${{ matrix.service }}" = "orders" ] || [ "${{ matrix.service }}" = "notification" ]; then
            mypy --ignore-missing-imports services/${{ matrix.service }}/app
          elif [ "${{ matrix.service }}" = "scheduler" ]; then
            mypy --ignore-missing-imports services/scheduler/scheduler
          fi

      # ---- PYTEST ----
      - name: 🧪 Run tests with pytest
        run: |
          if [ -d "services/${{ matrix.service }}/tests" ]; then
            pytest services/${{ matrix.service }}/tests --maxfail=1 --disable-warnings -q
          else
            echo "No tests folder found for ${{ matrix.service }}, skipping pytest."
          fi
