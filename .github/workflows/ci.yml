name: 🧪 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [orders, notification, scheduler]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

    # Cài dependencies riêng cho từng service
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r services/${{ matrix.service }}/requirements.txt

    # Chỉ cài types-requests lại riêng cho scheduler trước khi chạy mypy
    - name: Fix types-requests for scheduler (if needed)
      if: matrix.service == 'scheduler'
      run: pip install --force-reinstall types-requests

    # Format code (autopep8)
    - name: Auto-format code with autopep8
      run: |
        if [ "${{ matrix.service }}" = "orders" ] || [ "${{ matrix.service }}" = "notification" ]; then
          autopep8 --in-place --aggressive --aggressive --recursive services/${{ matrix.service }}/app
        elif [ "${{ matrix.service }}" = "scheduler" ]; then
          autopep8 --in-place --aggressive --aggressive --recursive services/scheduler/scheduler
        fi

    # Lint code (flake8)
    - name: Lint code with flake8
      run: |
        if [ "${{ matrix.service }}" = "orders" ] || [ "${{ matrix.service }}" = "notification" ]; then
          flake8 services/${{ matrix.service }}/app
        elif [ "${{ matrix.service }}" = "scheduler" ]; then
          flake8 services/scheduler/scheduler
        fi

    # Type check (mypy)
    - name: Type check with mypy
      run: |
        if [ "${{ matrix.service }}" = "orders" ] || [ "${{ matrix.service }}" = "notification" ]; then
          mypy --ignore-missing-imports services/${{ matrix.service }}/app
        elif [ "${{ matrix.service }}" = "scheduler" ]; then
          mypy --ignore-missing-imports services/scheduler/scheduler
        fi

    # Test với pytest
    - name: Test with pytest
      run: |
        if [ "${{ matrix.service }}" = "orders" ] || [ "${{ matrix.service }}" = "notification" ]; then
          pytest services/${{ matrix.service }}/tests --maxfail=1 --disable-warnings -q
        elif [ "${{ matrix.service }}" = "scheduler" ]; then
          pytest services/scheduler/tests --maxfail=1 --disable-warnings -q
        fi
