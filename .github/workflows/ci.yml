name: 🧪 CI — Lint & Test Python Services

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy code về
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Cài dependencies cho từng service
      - name: Install dependencies for orders
        run: pip install -r services/orders/requirements.txt

      - name: Install dependencies for notification
        run: pip install -r services/notification/requirements.txt

      - name: Install dependencies for scheduler
        run: |
          pip install --upgrade pip
          pip install -r services/scheduler/requirements.txt
          pip install types-requests
          pip show types-requests || echo "types-requests NOT FOUND"

      # 4. Lint code
      - name: Lint orders
        run: flake8 services/orders/app

      - name: Lint notification
        run: flake8 services/notification/app

      - name: Lint scheduler
        run: flake8 services/scheduler/scheduler

      # 5. Type-check với mypy
      - name: mypy orders
        run: mypy --ignore-missing-imports services/orders

      - name: mypy notification
        run: mypy --ignore-missing-imports services/notification

      - name: mypy scheduler
        run: mypy --ignore-missing-imports services/scheduler

      # 6. Test với pytest
      - name: Test orders
        run: pytest services/orders/tests --maxfail=1 --disable-warnings -q

      - name: Test notification
        run: pytest services/notification/tests --maxfail=1 --disable-warnings -q

      - name: Test scheduler
        run: pytest services/scheduler/tests --maxfail=1 --disable-warnings -q
