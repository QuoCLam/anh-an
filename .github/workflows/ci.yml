name: CI — Lint & Test Python Services

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-orders:
    runs-on: ubuntu-latest
    name: Test Orders
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install dependencies for orders
        run: pip install -r services/orders/requirements.txt

      - name: Clean pycache and .pyc before test
        run: |
          find . -name "__pycache__" -type d -exec rm -rf {} +
          find . -name "*.pyc" -delete

      - name: Run pytest for orders
        run: pytest services/orders/tests/ --maxfail=1 --disable-warnings -q

  test-notification:
    runs-on: ubuntu-latest
    name: Test Notification
    steps:
