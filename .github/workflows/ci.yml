name: CI — Lint & Test Python Services

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [orders, notification, scheduler]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies for ${{ matrix.service }}
        run: |
          pip install -r services/${{ matrix.service }}/requirements.txt

      - name: Check pytest version
        run: |
          pytest --version

      - name: Run pytest for ${{ matrix.service }}
        run: |
          pytest services/${{ matrix.service }}/tests --maxfail=1 --disable-warnings -q
